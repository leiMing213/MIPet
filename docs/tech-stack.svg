<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 640" width="1280" height="640" font-family="'Microsoft YaHei', 'PingFang SC', sans-serif">
  <!-- Background -->
  <rect width="1280" height="640" fill="#ffffff"/>

  <!-- Row 1 -->

  <!-- Card 1: 客户端交互层 -->
  <rect x="60" y="40" width="370" height="150" rx="6" fill="#fff" stroke="#f0f0f0" stroke-width="1"/>
  <rect x="60" y="40" width="5" height="150" rx="2" fill="#f06000"/>
  <rect x="82" y="62" width="22" height="16" rx="2" fill="none" stroke="#f06000" stroke-width="2"/>
  <line x1="93" y1="78" x2="93" y2="84" stroke="#f06000" stroke-width="2"/>
  <line x1="85" y1="84" x2="101" y2="84" stroke="#f06000" stroke-width="2"/>
  <text x="115" y="77" font-size="16" font-weight="700" fill="#1a1a1a">客户端交互层</text>
  <text x="85" y="112" font-size="16" fill="#555">Electron 双窗口 + React 19 + TypeScript，</text>
  <text x="85" y="140" font-size="16" fill="#555">透明置顶悬浮窗实现沉浸式桌宠交互。</text>

  <!-- Card 2: 核心智能模型 -->
  <rect x="455" y="40" width="370" height="150" rx="6" fill="#fff" stroke="#f0f0f0" stroke-width="1"/>
  <rect x="455" y="40" width="5" height="150" rx="2" fill="#f06000"/>
  <circle cx="491" cy="70" r="10" fill="none" stroke="#f06000" stroke-width="2"/>
  <path d="M486 70 Q491 60 496 70 Q491 80 486 70" fill="none" stroke="#f06000" stroke-width="1.5"/>
  <text x="510" y="77" font-size="16" font-weight="700" fill="#1a1a1a">核心智能模型</text>
  <text x="480" y="112" font-size="16" fill="#555">搭载 <tspan font-weight="700">MiMo</tspan> 推理大模型，提供深度语义</text>
  <text x="480" y="140" font-size="16" fill="#555">理解与自主推理，驱动人格化行为决策。</text>

  <!-- Card 3: Agent 智能中枢 -->
  <rect x="850" y="40" width="370" height="150" rx="6" fill="#fff" stroke="#f0f0f0" stroke-width="1"/>
  <rect x="850" y="40" width="5" height="150" rx="2" fill="#f06000"/>
  <circle cx="886" cy="70" r="5" fill="#f06000"/>
  <circle cx="874" cy="80" r="3" fill="none" stroke="#f06000" stroke-width="1.5"/>
  <circle cx="898" cy="80" r="3" fill="none" stroke="#f06000" stroke-width="1.5"/>
  <circle cx="874" cy="60" r="3" fill="none" stroke="#f06000" stroke-width="1.5"/>
  <circle cx="898" cy="60" r="3" fill="none" stroke="#f06000" stroke-width="1.5"/>
  <line x1="882" y1="73" x2="877" y2="78" stroke="#f06000" stroke-width="1.2"/>
  <line x1="890" y1="73" x2="895" y2="78" stroke="#f06000" stroke-width="1.2"/>
  <line x1="882" y1="67" x2="877" y2="62" stroke="#f06000" stroke-width="1.2"/>
  <line x1="890" y1="67" x2="895" y2="62" stroke="#f06000" stroke-width="1.2"/>
  <text x="910" y="77" font-size="16" font-weight="700" fill="#1a1a1a">Agent 智能中枢</text>
  <text x="875" y="112" font-size="16" fill="#555">Agno 框架编排 Skills · Tools · Memory，</text>
  <text x="875" y="140" font-size="16" fill="#555">工具自主调用，流式输出，多轮决策。</text>

  <!-- Row 2 -->

  <!-- Card 4: 后端服务架构 -->
  <rect x="60" y="220" width="370" height="150" rx="6" fill="#fff" stroke="#f0f0f0" stroke-width="1"/>
  <rect x="60" y="220" width="5" height="150" rx="2" fill="#f06000"/>
  <rect x="82" y="242" width="24" height="8" rx="2" fill="none" stroke="#f06000" stroke-width="1.8"/>
  <rect x="82" y="253" width="24" height="8" rx="2" fill="none" stroke="#f06000" stroke-width="1.8"/>
  <rect x="82" y="264" width="24" height="8" rx="2" fill="none" stroke="#f06000" stroke-width="1.8"/>
  <circle cx="100" cy="246" r="1.5" fill="#f06000"/>
  <circle cx="100" cy="257" r="1.5" fill="#f06000"/>
  <circle cx="100" cy="268" r="1.5" fill="#f06000"/>
  <text x="115" y="262" font-size="16" font-weight="700" fill="#1a1a1a">后端服务架构</text>
  <text x="85" y="295" font-size="16" fill="#555">Python FastAPI 异步服务，SSE 流式推</text>
  <text x="85" y="323" font-size="16" fill="#555">送实现逐 token 实时响应。</text>

  <!-- Card 5: MBTI 人格引擎 -->
  <rect x="455" y="220" width="370" height="150" rx="6" fill="#fff" stroke="#f0f0f0" stroke-width="1"/>
  <rect x="455" y="220" width="5" height="150" rx="2" fill="#f06000"/>
  <polygon points="491,250 481,265 491,280 501,265" fill="none" stroke="#f06000" stroke-width="2"/>
  <line x1="481" y1="265" x2="501" y2="265" stroke="#f06000" stroke-width="1.2"/>
  <text x="510" y="262" font-size="16" font-weight="700" fill="#1a1a1a">MBTI 人格引擎</text>
  <text x="480" y="295" font-size="16" fill="#555">四维性格建模驱动对话与行为，互动触</text>
  <text x="480" y="323" font-size="16" fill="#555">发 + LLM 评估实现人格动态演化。</text>

  <!-- Card 6: 记忆系统 -->
  <rect x="850" y="220" width="370" height="150" rx="6" fill="#fff" stroke="#f0f0f0" stroke-width="1"/>
  <rect x="850" y="220" width="5" height="150" rx="2" fill="#f06000"/>
  <ellipse cx="886" cy="247" rx="12" ry="5" fill="none" stroke="#f06000" stroke-width="1.8"/>
  <path d="M874 247 L874 267 Q886 277 898 267 L898 247" fill="none" stroke="#f06000" stroke-width="1.8"/>
  <path d="M874 257 Q886 267 898 257" fill="none" stroke="#f06000" stroke-width="1.2"/>
  <text x="910" y="262" font-size="16" font-weight="700" fill="#1a1a1a">记忆系统</text>
  <text x="875" y="295" font-size="16" fill="#555">SQLite 持久化，事件 + 对话 + 成长多层</text>
  <text x="875" y="323" font-size="16" fill="#555">记忆累积，赋予宠物长期记忆能力。</text>

  <!-- Row 3 -->

  <!-- Card 7: 视觉内容生成 -->
  <rect x="60" y="400" width="370" height="150" rx="6" fill="#fff" stroke="#f0f0f0" stroke-width="1"/>
  <rect x="60" y="400" width="5" height="150" rx="2" fill="#f06000"/>
  <rect x="82" y="422" width="24" height="18" rx="2" fill="none" stroke="#f06000" stroke-width="1.8"/>
  <circle cx="89" cy="429" r="3" fill="none" stroke="#f06000" stroke-width="1.2"/>
  <polyline points="82,438 90,432 98,436 106,428" fill="none" stroke="#f06000" stroke-width="1.2"/>
  <text x="115" y="437" font-size="16" font-weight="700" fill="#1a1a1a">视觉内容生成</text>
  <text x="85" y="470" font-size="16" fill="#555">AI 图像生成 + Vision 分析 + Sprite 自动</text>
  <text x="85" y="498" font-size="16" fill="#555">切割，智能生成宠物外观与动画。</text>

  <!-- Card 8: 流式交互引擎 -->
  <rect x="455" y="400" width="370" height="150" rx="6" fill="#fff" stroke="#f0f0f0" stroke-width="1"/>
  <rect x="455" y="400" width="5" height="150" rx="2" fill="#f06000"/>
  <path d="M476 427 Q483 420 490 427 Q497 434 504 427" fill="none" stroke="#f06000" stroke-width="2"/>
  <path d="M476 437 Q483 430 490 437 Q497 444 504 437" fill="none" stroke="#f06000" stroke-width="2"/>
  <text x="510" y="437" font-size="16" font-weight="700" fill="#1a1a1a">流式交互引擎</text>
  <text x="480" y="470" font-size="16" fill="#555">SSE 逐 token 推送 + 多会话隔离，</text>
  <text x="480" y="498" font-size="16" fill="#555">打造类真人实时对话体验。</text>

  <!-- Card 9: 双窗口状态同步 -->
  <rect x="850" y="400" width="370" height="150" rx="6" fill="#fff" stroke="#f0f0f0" stroke-width="1"/>
  <rect x="850" y="400" width="5" height="150" rx="2" fill="#f06000"/>
  <path d="M878 430 L898 430" fill="none" stroke="#f06000" stroke-width="2"/>
  <polygon points="895,427 895,433 900,430" fill="#f06000"/>
  <path d="M898 440 L878 440" fill="none" stroke="#f06000" stroke-width="2"/>
  <polygon points="881,437 881,443 876,440" fill="#f06000"/>
  <text x="910" y="437" font-size="16" font-weight="700" fill="#1a1a1a">双窗口状态同步</text>
  <text x="875" y="470" font-size="16" fill="#555">localStorage + StorageEvent 跨窗口实时</text>
  <text x="875" y="498" font-size="16" fill="#555">同步，IPC 桥接原生能力。</text>
</svg>
